<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grundfläche · Höhe trainieren</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: Kopfband mit Logo rechts, Seitennavigation links (Themen V, 1–4), Inhalt rechts; auf dem Handy Navigation als Klappmenü. Mathe = dunkelblau */
:root{
  --bg:#f1f4fa; --surface:#ffffff; --fg:#141f38; --muted:#56627b; --line:#d5dcea;
  --band:#13285a; --band-fg:#ffffff; --accent:#3a6fd9; --accent-ink:#1d47a3; --accent-soft:#e3ebfb;
  --ok:#2e7d32; --ok-soft:#e5f3e6; --bad:#c62828; --bad-soft:#fbe7e7; --chip:#e6ebf5;
  --sign:#cc1f1f; --sign-in:#ffffff; --sign-ink:#141414;
  --f-head:"Bitter", Georgia, serif; --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1324; --surface:#151e35; --fg:#e4eaf7; --muted:#a0abc3; --line:#27324f;
  --band:#0e1d45; --band-fg:#f1f5fd; --accent:#6f9cff; --accent-ink:#a8c3ff; --accent-soft:#1b2a4f;
  --ok:#7fd483; --ok-soft:#1c3320; --bad:#ff8a80; --bad-soft:#3a1e1e; --chip:#202b47;
  --sign:#e04848; --sign-in:#f4f4f4; --sign-ink:#141414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1324; --surface:#151e35; --fg:#e4eaf7; --muted:#a0abc3; --line:#27324f;
  --band:#0e1d45; --band-fg:#f1f5fd; --accent:#6f9cff; --accent-ink:#a8c3ff; --accent-soft:#1b2a4f;
  --ok:#7fd483; --ok-soft:#1c3320; --bad:#ff8a80; --bad-soft:#3a1e1e; --chip:#202b47;
  --sign:#e04848; --sign-in:#f4f4f4; --sign-ink:#141414; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
header.top{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--f-head);font-size:1.3rem;margin:0;line-height:1.2;text-wrap:balance}
.top .sub{font-size:.8rem;opacity:.85;letter-spacing:.04em}
.top .ttl{flex:1;min-width:0}
.logo{background:#ffffff;border-radius:8px;padding:5px 9px;display:flex;align-items:center;flex-shrink:0}
.logo img{height:30px;width:auto;display:block}
.menu-btn{display:none;background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--band-fg);border-radius:6px;padding:6px 10px;font:inherit;font-size:.9rem;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px 10px;font-weight:700}
.side a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;color:var(--fg);text-decoration:none;font-size:.95rem}
.side a .n{font-size:.75rem;font-weight:700;min-width:30px;height:22px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-variant-numeric:tabular-nums}
.side a:hover{background:var(--chip)}
.side a.on{background:var(--band);color:var(--band-fg)}
.side a.on .n{background:var(--band-fg);color:var(--band)}
main{min-width:0}
main h2{font-family:var(--f-head);font-size:1.75rem;margin:0 0 6px;line-height:1.2;text-wrap:balance;color:var(--fg)}
main h3{font-family:var(--f-head);font-size:1.2rem;margin:0 0 10px}
.lead{color:var(--muted);max-width:68ch;margin:0 0 20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 18px;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-weight:600;background:none;border:none;padding:8px 14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.goalbox{border-left:5px solid var(--accent)}
.theory{max-width:72ch}
.theory p{margin:0 0 12px}
.theory ul,.theory ol{margin:0 0 12px;padding-left:22px}
.theory b{color:var(--accent-ink)}
.formel{font-family:var(--f-head);font-size:1.15rem;background:var(--chip);border-radius:8px;padding:10px 14px;margin:10px 0 14px;display:inline-block}
.merk{background:var(--accent-soft);border-radius:8px;padding:12px 16px;margin:14px 0}
.merk::before{content:"Merke";display:block;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:4px}
.fig{margin:10px 0 16px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto}
.fig .cap{font-size:.85rem;color:var(--muted);margin-top:4px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{stroke:var(--muted);stroke-width:1.5}
svg .ln{stroke:var(--accent-ink);stroke-width:3;fill:none}
svg .tri{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
svg .wedge{fill:var(--accent-soft);stroke:var(--accent-ink);stroke-width:2}
svg .hyp{stroke:var(--accent);stroke-width:3}
svg .pt{fill:var(--accent-ink)}
svg .ln2{stroke:var(--bad);stroke-width:3;fill:none} svg .ln3{stroke:var(--ok);stroke-width:3;fill:none}
svg text.lnt{fill:var(--accent-ink)} svg text.ln2t{fill:var(--bad)} svg text.ln3t{fill:var(--ok)}
.q .fig{margin:6px 0 10px}
svg text{fill:var(--fg);font-family:var(--f-body);font-size:14px}
svg text.s{fill:var(--muted);font-size:12px}
svg .sgn{fill:var(--sign)} svg .sgi{fill:var(--sign-in)} svg .sgk{fill:var(--sign-ink)}
svg text.sgt{fill:var(--sign-ink);font-weight:700;font-size:30px}
.tblwrap{overflow-x:auto;margin:10px 0 14px}
table.t{border-collapse:collapse;min-width:420px;width:100%;font-size:.95rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--chip)}
.goal{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.goal input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent-ink);flex-shrink:0}
.goal .txt{flex:1;min-width:0}
.goal .meta{font-size:.8rem;color:var(--muted)}
.goal a.go{font-size:.85rem;font-weight:600;color:var(--accent-ink);text-decoration:none;white-space:nowrap;padding:4px 9px;border-radius:6px;background:var(--accent-soft)}
.goals{display:flex;flex-direction:column;gap:8px}
.stars{color:var(--accent-ink);font-weight:700;letter-spacing:1px}
.prog{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.prog div{height:100%;background:var(--accent);width:0;transition:width .3s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.q .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--muted)}
.tag.b{background:var(--accent-soft);color:var(--accent-ink)}
.q .qt{font-weight:600;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.numrow{display:flex;gap:8px;align-items:center}
.numrow input{font:inherit;width:9em;max-width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums}
.numrow input.ok{border-color:var(--ok);background:var(--ok-soft)}
.numrow input.bad{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;align-items:center}
.match select{font:inherit;font-size:.95rem;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.match select.ok{border-color:var(--ok);background:var(--ok-soft)}
.match select.bad{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{font:inherit;font-weight:600;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;background:var(--band);color:var(--band-fg)}
.btn.sec{background:var(--chip);color:var(--fg)}
.btn:focus-visible,.side a:focus-visible,.tabs button:focus-visible,.goal a.go:focus-visible,.numrow input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{margin-top:10px;padding:9px 12px;border-radius:7px;font-size:.95rem}
.fb.ok{background:var(--ok-soft);color:var(--fg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--fg);border-left:4px solid var(--bad)}
.write textarea{width:100%;min-height:90px;font:inherit;padding:8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.sol{margin-top:10px;background:var(--accent-soft);border-radius:8px;padding:10px 14px}
.score{font-family:var(--f-head);font-size:2.2rem;font-variant-numeric:tabular-nums}
.foot{font-size:.82rem;color:var(--muted);margin-top:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--accent)}
.card .n{font-size:.8rem;color:var(--accent-ink);font-weight:700}
.card b{font-family:var(--f-head)}
.card .m{font-size:.82rem;color:var(--muted)}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  .menu-btn{display:inline-block}
  nav.side{position:static;display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
  nav.side.open{display:flex}
  .top h1{font-size:1.05rem}
  .logo img{height:24px}
  .match{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.12;margin:0 2px}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.eq{white-space:nowrap;font-weight:600}
.lzs{display:block;font-size:.75rem;opacity:.75}
.side a.on .lzs{opacity:.85}
.lzl{margin:4px 0}
details.th summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:12px}
details.th summary::-webkit-details-marker{display:none}
details.th summary h3{margin:0}
details.th[open] summary{margin-bottom:12px}
.blkhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 4px}
.blkhead h3{margin:0;font-size:1.35rem}
.q.done{border-color:var(--ok)}
.q .st{margin-left:auto;color:var(--ok);font-weight:700;font-size:1.2rem}
.q .qt{line-height:1.9}
.opts.row3{flex-direction:row;flex-wrap:wrap}
.opts.row3 .opt{flex:0 1 auto;min-width:8em}
.opt span{line-height:1.9}
.nl{display:inline-flex;align-items:center;gap:6px;font-weight:600;margin-right:12px}
.numrow{flex-wrap:wrap}
.numrow input,.ti{font:inherit;width:8em;max-width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums}
.ti{width:4.2em;padding:3px 5px}
.ti.ok,.numrow input.ok{border-color:var(--ok);background:var(--ok-soft)}
.ti.bad,.numrow input.bad{border-color:var(--bad);background:var(--bad-soft)}
table.tb{min-width:0;width:auto}
table.tb td,table.tb th{text-align:center;min-width:3.2em}
svg.ksi{cursor:crosshair;touch-action:manipulation}
svg .hit{fill:transparent}
svg .upt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg .upt.bad{fill:var(--bad)} svg .uln.bad{stroke:var(--bad)}
svg .spt{fill:none;stroke:var(--ok);stroke-width:3}
svg text.tl{fill:var(--accent-ink)}
.sol{line-height:1.9}
.fb{line-height:1.9}
.foot a{color:var(--accent-ink)}
.btn{text-decoration:none;display:inline-block}
[hidden]{display:none!important}
.pane .theory{max-width:none}svg .fa{fill:var(--accent-soft);stroke:var(--fg);stroke-width:2;stroke-linejoin:round}
svg .fb{fill:var(--ok-soft);stroke:var(--fg);stroke-width:2;stroke-linejoin:round}
svg .fw{fill:var(--surface);stroke:var(--fg);stroke-width:2}
svg .fn{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg .ff{stroke:none}
svg .hid{stroke-width:1.5}
svg .thin{fill:none;stroke:var(--fg);stroke-width:1.2}
svg .dot{fill:var(--fg);stroke:none}
svg .hl{fill:none;stroke:var(--bad);stroke-width:2}
svg .dsh{stroke-dasharray:6 4}
svg text.hlt{fill:var(--bad)}
svg .sgl{stroke:var(--fg);stroke-width:2.4;stroke-linecap:round}
svg .sgl.ok{stroke:var(--ok)}
svg.clk path:not(.reg),svg.clk text{pointer-events:none}
svg path.reg{cursor:pointer;transition:fill .15s}
svg path.reg:hover{fill:var(--chip)}
svg path.reg.sel{fill:#ffd966}
svg path.reg.oksel,svg path.reg.solr{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3}
svg path.reg.badsel{fill:var(--bad-soft)}
svg .stp{fill:var(--bad);stroke:var(--surface);stroke-width:2}
svg .ept{fill:var(--fg)}
svg .usl{stroke:var(--accent-ink)}
svg .usl.ok{stroke:var(--ok)}
svg .solg{stroke:var(--ok);stroke-width:3;opacity:.75}
.sktools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 2px}
.sktools .btn{padding:6px 12px;font-size:.92rem}
.sktools .btn.on{background:var(--band);color:var(--band-fg)}
.tag.nv{letter-spacing:.02em}
.tag.nv1{background:var(--ok-soft);color:var(--ok)}
.tag.nv2{background:#fff1d6;color:#9a5b00}
.tag.nv3{background:var(--bad-soft);color:var(--bad)}
:root[data-theme="dark"] .tag.nv2{background:#3a2e14;color:#ffc56b}
.nvrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 4px}
.nvrow .btn{padding:6px 12px;font-size:.9rem}
.nvrow .btn.on{background:var(--band);color:var(--band-fg)}
.teilh{font-weight:700;color:var(--accent-ink);margin:12px 0 2px;font-size:.92rem}
.teilh:first-child{margin-top:4px}
.figgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0 16px}
.fcard{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.fcard svg{max-width:100%;height:auto}
.fn2{font-size:.85rem;color:var(--muted)}
.fo{font-weight:700;color:var(--accent-ink);line-height:1.35}
</style>
</head>

<script>
/* =========================================================
   Lernseite LU 19 Grundfläche · Höhe – Üben nach Lernzielen
   Jede Aufgabe wird zufällig erzeugt: neu laden = neue Aufgaben
   ========================================================= */
function kesc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
let RNG=Math.random;
const R=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const pick=a=>a[Math.floor(RNG()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function F(n,dd=2){const f=10**dd;n=Math.round(n*f)/f;if(Object.is(n,-0))n=0;const neg=n<0;n=Math.abs(n);let [i,d]=String(n).split('.');if(i.length>3)i=i.replace(/\B(?=(\d{3})+(?!\d))/g,"'");return (neg?'−':'')+i+(d?','+d:'');}
const F4=n=>F(n,4);
const r1=v=>Math.round(v*10)/10;
const PI=Math.PI;
const half=(a,b)=>RNG()<.35?R(a,b-1)+.5:R(a,b);
const NAMES=['Lea','Jonas','Elif','Noah','Mia','Luca','Sara','Nino','Aylin','Tim'];

/* ---------- Figuren: Modell → SVG ---------- */
const fP=(pts,o={})=>Object.assign({t:'p',pts},o);
const fT=(p,s,o={})=>Object.assign({t:'t',p,s},o);
const fL=(a,b,o={})=>fP([a,b],Object.assign({close:false,cls:'fn'},o));
function fRA(c,u1,u2,s){return fP([[c[0]+u1[0]*s,c[1]+u1[1]*s],[c[0]+(u1[0]+u2[0])*s,c[1]+(u1[1]+u2[1])*s],[c[0]+u2[0]*s,c[1]+u2[1]*s]],{close:false,cls:'thin'})}
function arcE(cx,cy,rx,ry,t0,t1,n=40){const a=[];for(let k=0;k<=n;k++){const t=t0+(t1-t0)*k/n;a.push([cx+rx*Math.cos(t),cy+ry*Math.sin(t)])}return a}
function bbox(items){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;items.forEach(it=>(it.t==='p'?it.pts:[it.p]).forEach(([x,y])=>{if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}));return[x0,y0,x1,y1]}
function svgFig(items,o={}){
  const [ax0,ay0,ax1,ay1]=bbox(items.filter(i=>i.t==='p'));const w=Math.max(ax1-ax0,.5),h=Math.max(ay1-ay0,.5);
  const s=o.s||Math.min(o.maxS||34,(o.maxW||330)/w,(o.maxH||220)/h);
  let x0=ax0,x1=ax1,y0=ay0,y1=ay1;
  items.filter(i=>i.t==='t').forEach(t=>{const tw=String(t.s).length*7.4/s;const[x,y]=t.p;let l=x,r=x;if(t.a==='s')r=x+tw;else if(t.a==='e')l=x-tw;else{l=x-tw/2;r=x+tw/2}x0=Math.min(x0,l);x1=Math.max(x1,r);y0=Math.min(y0,y-9/s);y1=Math.max(y1,y+9/s)});
  const p=8,W=(x1-x0)*s+2*p,H=(y1-y0)*s+2*p,X=x=>(p+(x-x0)*s).toFixed(1),Y=y=>(p+(y1-y)*s).toFixed(1);
  let out='<svg viewBox="0 0 '+W.toFixed(1)+' '+H.toFixed(1)+'" width="'+W.toFixed(0)+'" role="img" aria-label="'+kesc(o.label||'Figur')+'"'+(o.cls?' class="'+o.cls+'"':'')+'>';
  items.forEach(it=>{if(it.t==='p'){const d=it.pts.map(([x,y],i)=>(i?'L':'M')+X(x)+' '+Y(y)).join(' ')+(it.close===false?'':' Z');
      out+='<path d="'+d+'" class="'+(it.cls||'fn')+(it.dash?' dsh':'')+(it.reg?' reg':'')+'"'+(it.reg?' data-r="'+it.reg+'"':'')+'/>'}
    else out+='<text x="'+X(it.p[0])+'" y="'+(+Y(it.p[1])+5).toFixed(1)+'" text-anchor="'+({s:'start',e:'end'}[it.a]||'middle')+'"'+(it.c?' class="'+it.c+'"':'')+(it.b?' style="font-weight:700"':'')+'>'+kesc(it.s)+'</text>'});
  return out+'</svg>'}

/* ---------- 2D-Figuren ---------- */
function figRect(a,b,la,lb){return[fP([[0,0],[a,0],[a,b],[0,b]],{cls:'fa'}),fT([a/2,-.5],la),fT([a+.25,b/2],lb,{a:'s'})]}
function figTri(g,h,o,lg,lh,ls){const s=Math.max(g,h)*.05;const it=[fP([[0,0],[g,0],[o,h]],{cls:'fa'}),fL([o,h],[o,0],{cls:'hl',dash:1}),fRA([o,0],[1,0],[0,1],s),fT([g/2,-.5],lg)];
  if(lh)it.push(fT([o-.15,h*.45],lh,{a:'e',c:'hlt'}));if(ls)it.push(fT([(o+g)/2+.25,h/2+.1],ls,{a:'s'}));return it}
function figPar(g,h,o,lg,lh,ls){const s=Math.max(g,h)*.05;const it=[fP([[0,0],[g,0],[g+o,h],[o,h]],{cls:'fa'}),fL([o,h],[o,0],{cls:'hl',dash:1}),fRA([o,0],[1,0],[0,1],s),fT([g/2,-.5],lg)];
  if(lh)it.push(fT([o+.15,h*.45],lh,{a:'s',c:'hlt'}));if(ls)it.push(fT([o/2-.25,h/2],ls,{a:'e'}));return it}
function figTrap(a,c,h,o1,la,lc,lh){const s=Math.max(a,h)*.05,o=Math.max(o1,.6);const it=[fP([[0,0],[a,0],[o1+c,h],[o1,h]],{cls:'fa'}),fT([a/2,-.5],la),fT([o1+c/2,h+.45],lc)];
  it.push(fL([o1+c*.5,h],[o1+c*.5,0],{cls:'hl',dash:1}),fRA([o1+c*.5,0],[1,0],[0,1],s));if(lh)it.push(fT([o1+c*.5+.15,h*.45],lh,{a:'s',c:'hlt'}));return it}
function figKreis(r,lab,useD){const it=[fP(arcE(0,0,r,r,0,2*PI,72),{cls:'fa'}),fP(arcE(0,0,.06*r,.06*r,0,2*PI,12),{cls:'dot'})];
  const oy=Math.max(.42,r*.2);if(useD){it.push(fL([-r,0],[r,0],{cls:'thin'}),fT([0,oy],lab))}else{it.push(fL([0,0],[r,0],{cls:'thin'}),fT([r/2,oy],lab))}return it}

/* ---------- Körper (Schrägbild, Kavalierperspektive) ---------- */
const K3=0.35,VIEW=[-K3,1,-K3];
const PR=([x,y,z])=>[x+K3*y,z+K3*y];
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function solidModel(V,faces,o={}){
  const n=V.length,c=V.reduce((s,p)=>[s[0]+p[0]/n,s[1]+p[1]/n,s[2]+p[2]/n],[0,0,0]);
  faces.forEach(f=>{const vs=f.v.map(i=>V[i]);let nn=[0,0,0];for(let i=0;i<vs.length;i++){const a=vs[i],b=vs[(i+1)%vs.length];nn[0]+=(a[1]-b[1])*(a[2]+b[2]);nn[1]+=(a[2]-b[2])*(a[0]+b[0]);nn[2]+=(a[0]-b[0])*(a[1]+b[1])}
    const fc=vs.reduce((s,p)=>[s[0]+p[0]/vs.length,s[1]+p[1]/vs.length,s[2]+p[2]/vs.length],[0,0,0]);if(dot3(nn,[fc[0]-c[0],fc[1]-c[1],fc[2]-c[2]])<0)nn=nn.map(v=>-v);f.vis=dot3(nn,VIEW)<-1e-9});
  const E={};faces.forEach(f=>f.v.forEach((a,i)=>{const b=f.v[(i+1)%f.v.length],k=Math.min(a,b)+'-'+Math.max(a,b);if(!E[k])E[k]={a,b,vis:false};if(f.vis)E[k].vis=true}));
  const P2=V.map(PR),it=[];

   e:{3:'Nur die 8 Ecken haben 3 bemalte Flächen.',2:'An jeder der 12 Kanten liegen '+(n-2)+' Würfelchen (ohne Ecken): 12 · '+(n-2)+' = '+12*(n-2)+'.',1:'Auf jeder der 6 Flächen liegen in der Mitte '+(n-2)+' · '+(n-2)+' Würfelchen: 6 · '+(n-2)**2+' = '+6*(n-2)**2+'.',0:'Innen liegt ein Würfel aus '+(n-2)+' · '+(n-2)+' · '+(n-2)+' = '+(n-2)**3+' Würfelchen.'}[k],h:'Ecken, Kanten, Flächenmitten oder innen? Zeichne ein Schrägbild.'}},
s4_wire:()=>{const a=R(3,12),b=R(2,9),c=R(2,8);if(RNG()<.5)return{t:'num',g:9,b:'Anwenden',u:'cm',q:'Für ein Kantenmodell eines Quaders ('+a+' cm × '+b+' cm × '+c+' cm) braucht man Draht für alle Kanten. Wie viel Draht braucht es?',a:4*(a+b+c),e:'Ein Quader hat 12 Kanten, je 4 gleich lange: 4 · ('+a+' + '+b+' + '+c+') = <b>'+4*(a+b+c)+' cm</b>',h:'Wie viele Kanten hat ein Quader? Wie viele davon sind gleich lang?'};
  return{t:'num',g:9,b:'Analysieren',u:'cm',q:'Für das Kantenmodell eines Quaders braucht man '+4*(a+b+c)+' cm Draht. Er ist '+a+' cm lang und '+b+' cm breit. Wie hoch ist er?',a:c,e:4*(a+b+c)+' : 4 = '+(a+b+c)+' cm; '+(a+b+c)+' − '+a+' − '+b+' = <b>'+c+' cm</b>',h:'Teile zuerst durch 4.'}},

/* ===== Teil 3: Mantel und Oberfläche (LZ 9, 10) ===== */
s5_Mq:()=>{const a=R(2,9),b=R(2,7),h=R(2,10);return{t:'num',g:10,b:'Anwenden',u:'cm²',q:'Berechne die Mantelfläche M des Quaders (die vier Seitenflächen, ohne Grund- und Deckfläche).',svg:fig(figQuader(a,b,h),'Quader'),a:2*(a+b)*h,
  e:'u = '+a+' + '+b+' + '+a+' + '+b+' = '+2*(a+b)+' cm; M = u · h = '+2*(a+b)+' · '+h+' = <b>'+2*(a+b)*h+' cm²</b>',h:'M = u · h. u ist der Umfang der Grundfläche.'}},
s5_Mt:()=>{const [p,q,s]=pick(TRI),L=R(4,15);return{t:'num',g:10,b:'Anwenden',u:'cm²',q:'Berechne die Mantelfläche M des liegenden Dreiecksprismas.',svg:fig(figTriL(p,q,s,L),'Dreiecksprisma',{maxS:24}),a:(p+q+s)*L,
  e:'u = '+F(p)+' + '+F(q)+' + '+F(s)+' = '+F(p+q+s)+' cm; M = u · h = '+F(p+q+s)+' · '+L+' = <b>'+F((p+q+s)*L)+' cm²</b>',h:'Die Grundfläche ist das Dreieck vorne. Ihr Umfang mal die Höhe des Prismas.'}},
s5_Mz:()=>{const r=R(2,8),h=R(3,15),d=RNG()<.4;return{t:'num',g:10,b:'Anwenden',u:'cm²',pi:1,q:'Berechne die Mantelfläche M des Zylinders.',svg:fig(cylS(r,h,d?{ld:'d = '+2*r+' cm',lh:'h = '+h+' cm'}:{lr:'r = '+r+' cm',lh:'h = '+h+' cm'}),'Zylinder',{maxS:22}),a:2*PI*r*h,
  e:'u = 2 · π · r = '+F(2*PI*r)+' cm; M = u · h ≈ '+F(2*PI*r)+' · '+h+' ≈ <b>'+F(2*PI*r*h)+' cm²</b>',h:'M = u · h mit u = 2 · π · r. '+PIH}},
s5_Sq:()=>{const a=R(2,9),b=R(2,7),h=R(2,10);return{t:'num',g:11,b:'Anwenden',u:'cm²',q:'Berechne die Oberfläche S des Quaders.',svg:fig(figQuader(a,b,h),'Quader'),a:2*a*b+2*(a+b)*h,
  e:'G = '+a+' · '+b+' = '+a*b+' cm²; M = '+2*(a+b)+' · '+h+' = '+2*(a+b)*h+' cm²; S = 2 · G + M = '+2*a*b+' + '+2*(a+b)*h+' = <b>'+(2*a*b+2*(a+b)*h)+' cm²</b>',h:'S = 2 · G + M. Grund- und Deckfläche zählen beide.'}},
s5_St:()=>{const [p,q,s]=pick(TRI),L=R(4,15),Gf=p*q/2,M=(p+q+s)*L;return{t:'num',g:11,b:'Anwenden',u:'cm²',q:'Berechne die Oberfläche S des Dreiecksprismas. Das Dreieck hat bei a und b einen rechten Winkel.',svg:fig(figTriL(p,q,s,L,1),'Dreiecksprisma',{maxS:24}),a:2*Gf+M,
  e:'G = '+F(p)+' · '+F(q)+' : 2 = '+F(Gf)+' cm²; M = ('+F(p)+' + '+F(q)+' + '+F(s)+') · '+L+' = '+F(M)+' cm²; S = 2 · '+F(Gf)+' + '+F(M)+' = <b>'+F(2*Gf+M)+' cm²</b>',h:'Grundfläche = rechtwinkliges Dreieck: A = a · b : 2.'}},
s5_Sz:()=>{const r=R(2,8),h=R(3,15);return{t:'num',g:11,b:'Anwenden',u:'cm²',pi:1,q:'Berechne die Oberfläche S des Zylinders.',svg:fig(cylS(r,h,{lr:'r = '+r+' cm',lh:'h = '+h+' cm'}),'Zylinder',{maxS:22}),a:2*PI*r*r+2*PI*r*h,
  e:'G = π · '+r+'² ≈ '+F(PI*r*r)+' cm²; M = 2 · π · '+r+' · '+h+' ≈ '+F(2*PI*r*h)+' cm²; S = 2 · G + M ≈ <b>'+F(2*PI*r*r+2*PI*r*h)+' cm²</b>',h:'S = 2 · G + M. '+PIH}},
s5_err:()=>{const nm=pick(NAMES),ty=pick(['oneG','area','uh']);const W=['Es wurde nur eine Grundfläche gezählt. Es braucht 2 · G.','Für M wurde die Kreisfläche statt der Umfang genommen.','Der Umfang fehlt: Es wurde nur a · h gerechnet.','Das ist richtig.'];
  if(ty==='oneG'){const a=R(3,8),b=R(2,6),h=R(2,8);const Gf=a*b,M=2*(a+b)*h;return mcFrom(W[0],shuffle(W.slice(1)),{g:11,b:'Analysieren',q:'Fehler finden: '+nm+' berechnet die Oberfläche des Quaders: S = '+Gf+' + '+M+' = '+(Gf+M)+' cm². Was stimmt?',svg:fig(figQuader(a,b,h),'Quader'),e:'S = 2 · G + M = 2 · '+Gf+' + '+M+' = '+(2*Gf+M)+' cm².',h:'Wie viele Grundflächen hat ein Quader?'})}
  if(ty==='area'){const r=R(2,6),h=R(4,10);return mcFrom(W[1],shuffle([W[0],W[2],W[3]]),{g:10,b:'Analysieren',q:'Fehler finden: '+nm+' berechnet den Mantel des Zylinders: M = π · '+r+'² · '+h+' ≈ '+F(PI*r*r*h)+' cm². Was stimmt?',svg:fig(cylS(r,h,{lr:'r = '+r+' cm',lh:'h = '+h+' cm'}),'Zylinder',{maxS:22}),e:'M = u · h = 2 · π · '+r+' · '+h+' ≈ '+F(2*PI*r*h)+' cm². (π · r² · h wäre das Volumen.)',h:'M = u · h. Was ist u beim Kreis?'})}
  const a=R(3,8),b=R(2,6),h=R(2,8);return mcFrom(W[2],shuffle([W[0],W[1],W[3]]),{g:10,b:'Analysieren',q:'Fehler finden: '+nm+' berechnet den Mantel des Quaders: M = '+a+' · '+h+' = '+a*h+' cm². Was stimmt?',svg:fig(figQuader(a,b,h),'Quader'),e:'M = u · h = 2 · ('+a+' + '+b+') · '+h+' = '+2*(a+b)*h+' cm².',h:'Der Mantel besteht aus vier Seitenflächen.'})},
s5_all:()=>{const ty=pick(['dose','geschenk','zelt','schachtel']);
  if(ty==='dose'){const d=pick([6,7,8,10]),h=pick([8,10,11,12]);return{t:'num',g:10,b:'Anwenden',u:'cm²',pi:1,q:'Eine Dose hat den Durchmesser '+d+' cm und ist '+h+' cm hoch. Wie viel cm² Papier braucht die Etikette rund um die Dose?',svg:fig(cylS(d/2,h,{ld:'d = '+d+' cm',lh:'h = '+h+' cm'}),'Dose',{maxS:20}),a:PI*d*h,e:'Etikette = Mantel: u = π · '+d+' ≈ '+F(PI*d)+' cm; M = u · h ≈ '+F(PI*d)+' · '+h+' ≈ <b>'+F(PI*d*h)+' cm²</b>',h:'Die Etikette ist der Mantel. '+PIH}}
  if(ty==='geschenk'){const a=R(15,40),b=R(10,25),h=R(5,15);return{t:'num',g:11,b:'Anwenden',u:'cm²',q:'Ein Geschenk ist eine Schachtel ('+a+' cm × '+b+' cm × '+h+' cm). Wie viel cm² Papier braucht es mindestens, um sie ganz einzupacken?',a:2*(a*b+a*h+b*h),e:'S = 2 · '+a+' · '+b+' + 2 · '+a+' · '+h+' + 2 · '+b+' · '+h+' = '+2*a*b+' + '+2*a*h+' + '+2*b*h+' = <b>'+2*(a*b+a*h+b*h)+' cm²</b>',h:'Ganz einpacken = Oberfläche S.'}}
  if(ty==='schachtel'){const a=R(10,30),b=R(8,20),h=R(4,12);return{t:'num',g:11,b:'Analysieren',lv:3,u:'cm²',q:'Eine Schachtel ohne Deckel ist '+a+' cm lang, '+b+' cm breit und '+h+' cm hoch. Wie viel cm² Karton braucht es?',a:a*b+2*(a+b)*h,e:'Ohne Deckel: nur 1 · G + M = '+a*b+' + '+2*(a+b)+' · '+h+' = '+a*b+' + '+2*(a+b)*h+' = <b>'+(a*b+2*(a+b)*h)+' cm²</b>',h:'Ohne Deckel fehlt eine Grundfläche.'}}
  const [p,q,s]=pick([[0.8,0.6,1],[1.2,0.9,1.5],[0.9,1.2,1.5],[1.2,1.6,2]]),L=pick([2,2.5,3]);const g=2*p,A=g*q+2*s*L;
  return{t:'num',g:11,b:'Analysieren',lv:3,u:'m²',q:'Ein Zelt hat die Form eines liegenden Dreiecksprismas: Das Dreieck vorne ist '+F(g)+' m breit und '+F(q)+' m hoch, die schrägen Seiten sind je '+F(s)+' m lang. Das Zelt ist '+F(L)+' m lang. Wie viel m² Stoff braucht es <b>ohne Boden</b>?',
   svg:fig(prism([[0,0],[g,0],[p,q]],L,'lie',{labels:[[0,1,F(g)+' m'],[1,2,F(s)+' m',[q,p]],[1,4,F(L)+' m']],extra:[()=>fL([p,q],[p,0],{cls:'hl',dash:1}),()=>fT([p-g*.03,q*.3],F(q)+' m',{a:'e',c:'hlt'})]}),'Zelt',{maxS:60}),a:A,
   e:'Vorne + hinten: 2 · ('+F(g)+' · '+F(q)+' : 2) = '+F(g*q)+' m². Zwei schräge Dachflächen: 2 · '+F(s)+' · '+F(L)+' = '+F(2*s*L)+' m². Zusammen: <b>'+F(A)+' m²</b> (der Boden fehlt).',h:'Welche Flächen hat das Zelt ohne Boden?'}},

/* ===== Teil 3: Raum- und Hohlmasse (LZ 12) ===== */
s6_c1:()=>{const c=conv(P1);return{t:'num',g:8,b:'Anwenden',u:c.t,q:'Rechne um: <b>'+F4(c.v)+' '+c.f+' = ? '+c.t+'</b>',a:c.a,tol:Math.abs(c.a)*1e-7+1e-9,e:convE(c),h:'Raummasse: Umrechnungszahl 1000. Hohlmasse: Umrechnungszahl 10. 1 dm³ = 1 l, 1 cm³ = 1 ml.'}},
s6_c2:()=>{const c=conv(P2);return{t:'num',g:8,b:'Anwenden',u:c.t,q:'Rechne um: <b>'+F4(c.v)+' '+c.f+' = ? '+c.t+'</b>',a:c.a,tol:Math.abs(c.a)*1e-7+1e-9,e:convE(c),h:'Gehe Schritt für Schritt über die Einheitenreihe. 1 l = 1 dm³ = 1000 cm³, 1 m³ = 1000 l.'}},
s6_multi:()=>{const cs=[conv(P1),conv(P1),conv(P2)];return{t:'multi',g:8,b:'Anwenden',q:'Rechne um.',fields:cs.map(c=>({lab:F4(c.v)+' '+c.f+' =',a:c.a,u:c.t,tol:Math.abs(c.a)*1e-7+1e-9})),e:cs.map(convE).join('<br>'),h:'Raummasse: 1000. Hohlmasse: 10. 1 dm³ = 1 l.'}},
s6_eq:()=>{const c=conv([...P1,...P2]);const w=[c.a*10,c.a/10,c.a*100,c.a/100].map(clean).filter(v=>v!==c.a&&decs(v)<=5);const ok=F4(c.a)+' '+c.t;
  return mcFrom(ok,shuffle(w).map(v=>F(v,5)+' '+c.t),{g:8,b:'Verstehen',q:'Welche Angabe ist gleich gross wie <b>'+F4(c.v)+' '+c.f+'</b>?',e:convE(c),h:'Grössere Einheit → mehr Stück der kleineren Einheit.'})},
s6_err:()=>{const nm=pick(NAMES),ty=pick(['r100','h100','dir','ok']);let v,f,t,wrong,ok,e;
  if(ty==='r100'){[f,t]=pick([['dm³','cm³'],['m³','dm³'],['cm³','mm³']]);v=pick([2,3.5,1.2,0.4,4.5]);wrong=v*100;ok='Bei Raummassen ist die Umrechnungszahl 1000, nicht 100.';e=F(v)+' '+f+' = '+F(v*1000)+' '+t}
  if(ty==='h100'){[f,t]=pick([['l','dl'],['dl','cl'],['cl','ml']]);v=pick([2,3.5,1.2,0.4,4.5]);wrong=v*100;ok='Bei Hohlmassen ist die Umrechnungszahl 10, nicht 100.';e=F(v)+' '+f+' = '+F(v*10)+' '+t}
  if(ty==='dir'){[f,t]=pick([['dm³','cm³'],['l','ml'],['m³','dm³']]);v=pick([2,3,5,4.5,1.5]);wrong=v/1000;ok='Falsche Richtung: Von der grösseren zur kleineren Einheit wird die Zahl grösser.';e=F(v)+' '+f+' = '+F(v*1000)+' '+t}
  if(ty==='ok'){[f,t]=pick([['l','dm³'],['ml','cm³'],['dm³','l']]);v=pick([2,3.5,250,0.75]);wrong=v;ok='Das ist richtig.';e='1 '+f+' = 1 '+t+', also '+F(v)+' '+f+' = '+F(v)+' '+t+'.'}
  return mcFrom(ok,shuffle(['Bei Raummassen ist die Umrechnungszahl 1000, nicht 100.','Bei Hohlmassen ist die Umrechnungszahl 10, nicht 100.','Falsche Richtung: Von der grösseren zur kleineren Einheit wird die Zahl grösser.','Das ist richtig.'].filter(x=>x!==ok)),{g:8,b:'Analysieren',q:'Fehler finden: '+nm+' schreibt <b>'+F4(v)+' '+f+' = '+F(wrong,5)+' '+t+'</b>. Was stimmt?',e:'Richtig: '+e+'.',h:'Welche Umrechnungszahl gilt hier? Wird die Zahl grösser oder kleiner?'})},
s6_sum:()=>{const a=pick([0.5,1,1.5,2]),b=pick([2,3,4,5]),c=pick([100,150,250,500]),tot=a+b/10+c/1000;return{t:'num',g:8,b:'Anwenden',u:'l',q:'Rechne zusammen und gib das Resultat in Litern an: <b>'+F(a)+' l + '+b+' dl + '+c+' ml</b>',a:tot,tol:1e-6,e:b+' dl = '+F(b/10)+' l; '+c+' ml = '+F(c/1000,3)+' l; '+F(a)+' + '+F(b/10)+' + '+F(c/1000,3)+' = <b>'+F(tot,3)+' l</b>',h:'Rechne zuerst alles in Liter um.'}},
s6_est:()=>{const L=[['Eine Tasse fasst etwa …','2 dl',['2 l','2 ml','2 hl']],['Eine Badewanne fasst etwa …','150 l',['150 ml','15 m³','150 cl']],['Ein Teelöffel fasst etwa …','5 ml',['5 dl','5 l','5 hl']],['Ein Klassenzimmer hat ein Volumen von etwa …','200 m³',['200 dm³','200 l','200 cm³']],['Ein Würfelzucker hat ein Volumen von etwa …','2 cm³',['2 dm³','2 m³','2 l']],['Eine Milchpackung fasst …','1 l',['1 ml','1 hl','1 m³']],['Ein Putzkessel fasst etwa …','10 l',['10 ml','10 hl','10 m³']],['Eine Schuhschachtel hat ein Volumen von etwa …','6 dm³',['6 cm³','6 m³','6 mm³']]];
  const [q,ok,w]=pick(L);return mcFrom(ok,w,{g:8,b:'Bewerten',q,e:'Passend ist '+ok+'. Stell dir vor: 1 l = 1 dm³ ist ein Würfel mit 10 cm Kantenlänge.',h:'1 l = Milchpackung, 1 dl = kleines Glas, 1 m³ = Würfel mit 1 m Kante.'})},

/* ===== Teil 3: Volumen (LZ 11, 13, 14) ===== */
s7_Vq:()=>{const a=R(2,12),b=R(2,9),h=half(2,10);return{t:'num',g:12,b:'Anwenden',u:'cm³',q:'Berechne das Volumen V des Quaders.',svg:fig(figQuader(a,b,h),'Quader'),a:a*b*h,e:'G = '+a+' · '+b+' = '+a*b+' cm²; V = G · h = '+a*b+' · '+F(h)+' = <b>'+F(a*b*h)+' cm³</b>',h:'V = G · h. Beim Quader: G = a · b.'}},
s7_Vt:()=>{const [p,q,s]=pick(TRI),L=R(4,15),Gf=p*q/2;return{t:'num',g:12,b:'Anwenden',u:'cm³',q:'Berechne das Volumen V des Dreiecksprismas (rechter Winkel zwischen a und b).',svg:fig(figTriL(p,q,s,L,1),'Dreiecksprisma',{maxS:24}),a:Gf*L,e:'G = '+F(p)+' · '+F(q)+' : 2 = '+F(Gf)+' cm²; V = G · h = '+F(Gf)+' · '+L+' = <b>'+F(Gf*L)+' cm³</b>. Die Seite c brauchst du nicht.',h:'V = G · h. Die Grundfläche ist das Dreieck (grün).'}},
s7_Vz:()=>{const r=R(2,8),h=R(3,15),d=RNG()<.4;return{t:'num',g:12,b:'Anwenden',u:'cm³',pi:1,q:'Berechne das Volumen V des Zylinders.',svg:fig(cylS(r,h,d?{ld:'d = '+2*r+' cm',lh:'h = '+h+' cm'}:{lr:'r = '+r+' cm',lh:'h = '+h+' cm'}),'Zylinder',{maxS:22}),a:PI*r*r*h,e:(d?'r = '+r+' cm; ':'')+'G = π · '+r+'² ≈ '+F(PI*r*r)+' cm²; V = G · h ≈ '+F(PI*r*r)+' · '+h+' ≈ <b>'+F(PI*r*r*h)+' cm³</b>',h:'V = G · h mit G = π · r². '+PIH}},
s7_Vtr:()=>{const a=R(6,12),c=R(2,a-2),t=R(2,6),L=R(5,15),Gf=(a+c)/2*t;return{t:'num',g:12,b:'Anwenden',u:'cm³',q:'Berechne das Volumen des Prismas. Die Grundfläche ist ein Trapez (vorne, Höhe rot).',svg:fig(figTrapL(a,c,t,L),'Trapezprisma',{maxS:22}),a:Gf*L,e:'G = ('+a+' + '+c+') : 2 · '+t+' = '+F(Gf)+' cm²; V = G · h = '+F(Gf)+' · '+L+' = <b>'+F(Gf*L)+' cm³</b>',h:'Zuerst die Trapezfläche: (a + c) : 2 · Höhe des Trapezes.'}},
s7_l:()=>{const a=pick([40,50,60,80,100]),b=pick([25,30,35,40]),w=pick([20,25,30,35]);const it=prism([[0,0],[a/10,0],[a/10,b/10],[0,b/10]],(w+10)/10,'stand',{labels:[[0,1,'a = '+a+' cm'],[1,2,'b = '+b+' cm']]});
  it.push(fL(PR([0,0,w/10]),PR([a/10,0,w/10]),{cls:'hl'}),fL(PR([a/10,0,w/10]),PR([a/10,b/10,w/10]),{cls:'hl'}),fT([-.2,w/20],'Wasser '+w+' cm',{a:'e',c:'hlt'}));
  return{t:'num',g:12,b:'Anwenden',u:'l',q:'Ein Aquarium ist '+a+' cm lang und '+b+' cm breit. Das Wasser steht '+w+' cm hoch. Wie viele Liter Wasser sind drin?',svg:fig(it,'Aquarium',{maxS:30}),a:a*b*w/1000,
  e:'V = '+a+' · '+b+' · '+w+' = '+F(a*b*w)+' cm³ = '+F(a*b*w/1000)+' dm³ = <b>'+F(a*b*w/1000)+' l</b>',h:'Rechne in cm³ und dann um: 1000 cm³ = 1 dm³ = 1 l.'}},
s7_h:()=>{if(RNG()<.5){const a=R(4,12),b=R(3,10),h=R(2,15);return{t:'num',g:13,b:'Anwenden',u:'cm',q:'Ein Quader hat das Volumen '+F(a*b*h)+' cm³. Die Grundfläche ist '+a+' cm × '+b+' cm. Wie hoch ist er?',a:h,e:'G = '+a+' · '+b+' = '+a*b+' cm²; h = V : G = '+F(a*b*h)+' : '+a*b+' = <b>'+h+' cm</b>',h:'h = V : G.'}}
  const r=pick([5,6,8,10]),V=pick([1,2,3,5]);return{t:'num',g:13,b:'Analysieren',lv:3,u:'cm',pi:1,q:'In einen zylinderförmigen Topf (Radius '+r+' cm) giesst man '+V+' l Wasser. Wie hoch steht das Wasser?',svg:fig(cylS(r/2,4,{lr:'r = '+r+' cm'}),'Topf',{maxS:22}),a:V*1000/(PI*r*r),
  e:V+' l = '+V*1000+' cm³; G = π · '+r+'² ≈ '+F(PI*r*r)+' cm²; h = V : G ≈ '+V*1000+' : '+F(PI*r*r)+' ≈ <b>'+F(V*1000/(PI*r*r))+' cm</b>',h:'Liter in cm³ umrechnen, dann h = V : G. '+PIH}},
s7_g:()=>{const Gf=R(12,90),h=R(3,15);return{t:'num',g:13,b:'Anwenden',u:'cm²',q:'Ein Prisma hat das Volumen '+F(Gf*h)+' cm³ und ist '+h+' cm hoch. Wie gross ist seine Grundfläche G?',a:Gf,e:'G = V : h = '+F(Gf*h)+' : '+h+' = <b>'+Gf+' cm²</b>',h:'V = G · h, also G = V : h.'}},
s7_tr1:()=>{const ty=pick(['milch','pool','klotz','wuerfel']);

s1:{nr:1,teil:1,title:'Flächen berechnen',gen:['s1_rect','s1_tri','s1_tri2','s1_par','s1_trap','s1_kA','s1_kd','s1_kU','s1_formula','s1_err','s1_which'],
theory:()=>`<p>Der <b>Flächeninhalt</b> A sagt, wie gross eine Fläche ist. Einheit: cm², m² … Der <b>Umfang</b> U ist die Länge des Randes. Einheit: cm, m …</p>
<div class="figgrid">${[[figRect(3.5,2.2,'a','b'),'Rechteck','A = a · b'],[figTri(4,2.5,1.2,'g','h'),'Dreieck','A = g · h : 2'],[figPar(3.4,2.2,1.2,'g','h'),'Parallelogramm','A = g · h'],[figTrap(4.4,2,2.2,1,'a','c','h'),'Trapez','A = (a + c) : 2 · h'],[figKreis(1.4,'r'),'Kreis','A = π · r²<br>U = 2 · π · r']].map(([f,n,t])=>'<div class="fcard">'+svgFig(f,{label:n,s:30})+'<div class="fn2">'+n+'</div><div class="fo">'+t+'</div></div>').join('')}</div>
<div class="merk">Die <b>Höhe h</b> steht immer <b>senkrecht</b> (rechter Winkel) auf der Grundseite. Rechne nie mit der schrägen Seite! Beim Kreis: r = d : 2.</div>
<p><b>Beispiel Trapez:</b> a = 8 cm, c = 4 cm, h = 3 cm → A = (8 + 4) : 2 · 3 = 6 · 3 = <b>18 cm²</b></p>
<p><b>Beispiel Kreis:</b> r = 5 cm → A = π · 5 · 5 ≈ <b>78,54 cm²</b>, U = 2 · π · 5 ≈ <b>31,42 cm</b>. Runde auf 2 Stellen nach dem Komma.</p>`},
s2:{nr:2,teil:1,title:'Zusammengesetzte Flächen',gen:['s2_L','s2_haus','s2_teich','s2_platz','s2_way','s2_err','s2_tr1','s2_tr2'],
theory:()=>`<p>Viele Flächen bestehen aus Rechtecken, Dreiecken, Trapezen oder Kreisen. Es gibt zwei Wege:</p>
<ul><li><b>Zerlegen:</b> Teile die Fläche in bekannte Figuren, berechne jede und <b>addiere</b>.</li><li><b>Ergänzen:</b> Ergänze zu einer grossen Figur und <b>ziehe</b> das, was zu viel ist, <b>ab</b>.</li></ul>
<div class="fig">${svgFig([fP([[0,0],[8,0],[8,3],[3,3],[3,6],[0,6]],{cls:'fa'}),fL([3,0],[3,3],{cls:'hl',dash:1}),fT([4,-.5],'8 cm'),fT([-.25,3],'6 cm',{a:'e'}),fT([1.5,6.45],'3 cm'),fT([8.25,1.5],'3 cm',{a:'s'}),fT([1.5,3],'A₁',{b:1}),fT([5.5,1.5],'A₂',{b:1}),
  fP([[11,0],[19,0],[19,6],[11,6]],{cls:'fw',dash:1}),fP([[11,0],[19,0],[19,3],[14,3],[14,6],[11,6]],{cls:'fa'}),fT([16.5,4.5],'weg',{c:'hlt'})],{label:'Zerlegen und Ergänzen',maxW:560})}</div>
<p><b>Zerlegen:</b> A₁ = 3 · 6 = 18 cm², A₂ = 5 · 3 = 15 cm² → A = 33 cm²<br><b>Ergänzen:</b> 8 · 6 = 48 cm², weg: 5 · 3 = 15 cm² → A = 33 cm²</p>
<div class="merk">Fehlende Längen findest du durch Rechnen: Die ganze Seite minus das bekannte Stück. Zeichne die Trennlinie ein und schreibe die Masse an.</div>
<p><b>Transfer:</b> Manchmal ist die Fläche gegeben und eine Seite gesucht. Dann rechnest du rückwärts, z. B. Rechteck: b = A : a.</p>`},
s3:{nr:3,teil:2,title:'Prisma und Zylinder',gen:['s3_class','s3_reason','s3_clickG','s3_clickS','s3_name','s3_count','s3_h','s3_true'],
theory:()=>`<div class="merk">Ein <b>Prisma</b> hat zwei <b>deckungsgleiche, parallele</b> Vielecke als <b>Grundfläche</b> und <b>Deckfläche</b>. Die <b>Seitenflächen</b> sind Rechtecke. Die <b>Höhe h</b> ist der Abstand zwischen Grund- und Deckfläche.</div>
<div class="fig">${svgFig([...prism(shiftP(ngon(5,1.8,PI/10),1.8,1.8),3.5,'stand',{hiG:1}),...shiftP2(prism([[0,0],[3.4,0],[1.7,2.6]],5,'lie',{hiG:1}),6,0),...shiftP2(cylS(1.5,3.5,{hiG:1}),13,0)],{label:'Fünfeckprisma, liegendes Dreiecksprisma und Zylinder',maxW:560})}</div>
<p>Grün: Grund- und Deckfläche. Ein Prisma heisst nach seiner Grundfläche: <b>Dreiecksprisma, Viereckprisma</b> (z. B. Quader, Würfel), <b>Fünfeckprisma</b> …</p>
<p>Ein <b>Zylinder</b> hat zwei deckungsgleiche, parallele <b>Kreise</b> als Grund- und Deckfläche. Die gekrümmte Fläche heisst <b>Mantel</b>.</p>
<div class="merk"><b>Achtung, liegendes Prisma:</b> Die Grundfläche muss nicht unten sein! Liegt das Prisma, ist sie vorne. Die Höhe ist dann die Länge nach hinten.</div>
<p><b>Kein Prisma</b> sind z. B. Pyramide und Kegel (Spitze, keine Deckfläche), Pyramidenstumpf (Deckfläche kleiner) und Kugel.</p>
<div class="tblwrap"><table class="t"><tr><th>Prisma mit n-Eck als Grundfläche</th><th>Ecken</th><th>Kanten</th><th>Flächen</th></tr><tr><td>Dreiecksprisma (n = 3)</td><td>6</td><td>9</td><td>5</td></tr><tr><td>Quader (n = 4)</td><td>8</td><td>12</td><td>6</td></tr><tr><td>allgemein</td><td>2 · n</td><td>3 · n</td><td>n + 2</td></tr></table></div>`},
s4:{nr:4,teil:2,title:'Schrägbild und Netz',gen:['s4_sk1','s4_sk2','s4_draw','s4_pick','s4_rule','s4_cube','s4_opp','s4_qnetz','s4_paint','s4_wire','s4_sk3'],
theory:()=>`<p><b>Schrägbild eines Quaders</b> auf Häuschenpapier (1 Häuschen = 5 mm):</p>
<ol><li>Zeichne die <b>Vorderfläche in wahrer Grösse</b>.</li><li>Zeichne die Kanten nach hinten <b>schräg nach hinten oben</b>: <b>1 cm Tiefe = 1 Häuschen schräg</b> (diagonal).</li><li>Verbinde die hinteren Ecken. Alle Kanten nach hinten sind <b>parallel und gleich lang</b>.</li><li><b>Verdeckte Kanten</b> zeichnest du <b>gestrichelt</b>.</li></ol>
<div class="fig">${gridSvg(12,8,cubSeg(1,1,6,4,2),{face:[[1,1],[7,1],[7,5],[1,5]],u:20,texts:[[4,0.35,'3 cm'],[11.6,3.2,'2 cm tief','end']],label:'Schrägbild Quader 3 cm × 2 cm × 2 cm'})}<div class="cap">Quader 3 cm breit, 2 cm hoch, 2 cm tief.</div></div>
<p><b>Netz eines Quaders:</b> Die 6 Flächen werden aufgeklappt. Grund- und Deckfläche (grün) hängen an derselben Seitenfläche. Die vier Seitenflächen bilden einen Streifen.</p>
<div class="fig">${svgFig([...[[0,0,4,2],[4,0,3,2],[7,0,4,2],[11,0,3,2]].map(([x,y,w,h])=>fP([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],{cls:'fa'})),fP([[0,-3],[4,-3],[4,0],[0,0]],{cls:'fb'}),fP([[0,2],[4,2],[4,5],[0,5]],{cls:'fb'}),fT([2,-3.45],'a'),fT([-.2,-1.5],'b',{a:'e'}),fT([14.2,1],'c',{a:'s'}),fT([2,-1.5],'G',{b:1}),fT([2,3.5],'D',{b:1})],{label:'Quadernetz',maxW:520})}</div>
<p><a class="btn" href="#sb">✎ Zum Schrägbild-Trainer</a></p>
<div class="merk">Gegenüberliegende Flächen eines Würfels berühren sich im Netz nie. Es gibt 11 verschiedene Würfelnetze.</div>`},
s5:{nr:6,teil:3,title:'Mantel und Oberfläche',gen:['s5_Mq','s5_Mt','s5_Mz','s5_Sq','s5_St','s5_Sz','s5_err','s5_all'],
theory:()=>`<p>Der <b>Mantel M</b> sind alle Seitenflächen zusammen (ohne Grund- und Deckfläche). Wickelst du ihn ab, entsteht ein <b>Rechteck</b>: so lang wie der Umfang u der Grundfläche, so hoch wie das Prisma.</p>
<div class="formel">M = u · h</div>
<div class="fig">${svgFig([fP([[0,0],[9.42,0],[9.42,3],[0,3]],{cls:'fa'}),fP(arcE(2,4.5,1.5,1.5,0,2*PI),{cls:'fb'}),fP(arcE(2,-1.5,1.5,1.5,0,2*PI),{cls:'fb'}),fT([4.71,-.5+0],'u = 2 · π · r'),fT([9.7,1.5],'h',{a:'s'}),fT([2,4.5],'G',{b:1}),fT([2,-1.5],'G',{b:1}),fT([5.5,1.5],'M',{b:1})],{label:'Netz eines Zylinders',maxW:420})}<div class="cap">Netz eines Zylinders: Mantel = Rechteck u × h.</div></div>
<p>Die <b>Oberfläche S</b> ist die ganze Hülle: zwei Grundflächen und der Mantel.</p>
<div class="formel">S = 2 · G + M</div>
<div class="tblwrap"><table class="t"><tr><th>Körper</th><th>G</th><th>u</th><th>M = u · h</th></tr><tr><td>Quader a × b × h</td><td>a · b</td><td>2 · (a + b)</td><td>2 · (a + b) · h</td></tr><tr><td>Zylinder</td><td>π · r²</td><td>2 · π · r</td><td>2 · π · r · h</td></tr></table></div>
<p><b>Beispiel Quader</b> 5 cm × 3 cm × 4 cm: G = 15 cm², u = 16 cm, M = 16 · 4 = 64 cm², S = 2 · 15 + 64 = <b>94 cm²</b>.</p>`},
s6:{nr:5,teil:2,title:'Raum- und Hohlmasse',gen:['s6_c1','s6_c2','s6_multi','s6_eq','s6_err','s6_sum','s6_est'],
theory:()=>`<p><b>Raummasse</b> (Volumen): Die Umrechnungszahl ist <b>1000</b>.</p>
<div class="tblwrap"><table class="t tb"><tr><td><b>m³</b></td><td>→ · 1000 →</td><td><b>dm³</b></td><td>→ · 1000 →</td><td><b>cm³</b></td><td>→ · 1000 →</td><td><b>mm³</b></td></tr></table></div>
<p><b>Hohlmasse</b> (Flüssigkeiten): Die Umrechnungszahl ist <b>10</b>.</p>
<div class="tblwrap"><table class="t tb"><tr><td><b>hl</b></td><td>· 100</td><td><b>l</b></td><td>· 10</td><td><b>dl</b></td><td>· 10</td><td><b>cl</b></td><td>· 10</td><td><b>ml</b></td></tr></table></div>
<div class="merk"><b>1 dm³ = 1 l</b> &nbsp; <b>1 cm³ = 1 ml</b> &nbsp; <b>1 m³ = 1000 l</b><br>Von der grösseren zur kleineren Einheit: <b>mal</b> (die Zahl wird grösser). Von der kleineren zur grösseren: <b>geteilt</b>.</div>
<p>Beispiele: 3,5 dm³ = 3500 cm³ · 2,5 l = 25 dl · 750 ml = 0,75 l · 4000 cm³ = 4 l</p>`},
s7:{nr:7,teil:3,title:'Volumen',gen:['s7_Vq','s7_Vt','s7_Vz','s7_Vtr','s7_l','s7_h','s7_g','s7_tr1','s7_tr2'],
theory:()=>`<p>Das <b>Volumen V</b> sagt, wie viel Platz ein Körper einnimmt. Stell dir vor: Die Grundfläche wird Schicht für Schicht übereinandergestapelt, bis die Höhe h erreicht ist.</p>
<div class="formel">V = G · h</div>
<div class="tblwrap"><table class="t"><tr><th>Körper</th><th>Volumen</th></tr><tr><td>Quader</td><td>V = a · b · h</td></tr><tr><td>Dreiecksprisma</td><td>V = (Dreiecksfläche) · h</td></tr><tr><td>Zylinder</td><td>V = π · r² · h</td></tr></table></div>
<p><b>Beispiel Zylinder</b> r = 4 cm, h = 10 cm: G = π · 4² ≈ 50,27 cm², V ≈ 50,27 · 10 ≈ <b>502,65 cm³</b> ≈ 0,5 l</p>
<div class="merk"><b>Rückwärts rechnen:</b> h = V : G und G = V : h. Bei Litern zuerst umrechnen: 1 l = 1000 cm³.</div>
<p><b>Beispiel:</b> Ein Quader hat V = 360 cm³ und G = 8 cm · 5 cm = 40 cm² → h = 360 : 40 = <b>9 cm</b>.</p>`}

function check(x,silent){

  if(x.t==='multi'){const ins=x.fields.map((f,i)=>el.querySelector('#'+x.id+'f'+i)),vs=ins.map(i=>parseVal(i.value));if(vs.every(v=>!isNaN(v))){ok=true;ins.forEach((i,j)=>{const f=x.fields[j],r=near(vs[j],f.a,f.tol??Math.max(.006,Math.abs(f.a)*1e-9));mark(i,r);if(!r)ok=false})}}
  if(x.t==='draw'){if(x.pts.length>=x.need){ok=x.target.every(([a,b])=>x.pts.some(p=>p[0]===a&&p[1]===b));

  if(x.t==='sketch'){if(x.segs.length){const T=pieces(x.target),U=pieces([...x.given,...x.segs]);let miss=0,extra=0,dash=0;

function makeSet(keys,n,nv){const out=[],seen=new Set();let pool=[],guard=0;
  while(out.length<n&&guard++<(nv?900:200)){if(!pool.length)pool=shuffle(keys);const k=pool.shift();if(out.length&&out[out.length-1].key===k&&keys.length>1)continue;

  return out}

  const pb=[1,2,3,0].map(t=>'<button class="btn'+(t===TPART?'':' sec')+'" data-tp="'+t+'">'+(t?'Teil '+t:'Alles gemischt')+'</button>').join('');

  $('#eval').addEventListener('click',()=>{let pts=0;const wrong={};
    TEST.forEach(x=>{const el=document.getElementById(x.id);const ok=check(x,true);if(ok)pts++;else wrong[x.g]=1;
      el.querySelector('.fbx').innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'Richtig.':ok===null?'Keine Antwort.':'Falsch.')+'</b> '+x.e+'</div>';if(!ok&&(x.t==='draw'||x.t==='click'||x.t==='sketch'))showSol(x);if(x.t==='draw'||x.t==='click'||x.t==='sketch')x.locked=true;});

  });
  if(withSol){doc.addPage();head('Lösungen zum Übungsblatt Nr. '+seed);y=36;
    order.forEach(t=>{const l1=doc.splitTextToSize(pdfTxt(t.sol),t.solFig?78:W-24);const h=t.solFig?Math.max(40,l1.length*4.6+6):l1.length*4.6+5;
      if(y+h>285){doc.addPage();head('Lösungen zum Übungsblatt Nr. '+seed);y=36}
      doc.setFont('helvetica','bold');doc.text('Aufgabe '+t._nr+':',L,y);doc.setFont('helvetica','normal');ptext(doc,l1,L+22,y);
      if(t.solFig)pdfFig(doc,t.solFig,L+102,y-4,68,40);y+=h});
    doc.setFontSize(9);doc.setTextColor(...GREY);doc.text(pdfTxt('Vergleiche zuerst deinen Weg, dann das Resultat. Bei pi-Aufgaben sind kleine Rundungsunterschiede richtig.'),L,Math.min(y+4,288));
  }
  const pages=doc.getNumberOfPages();for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFontSize(8);doc.setTextColor(...GREY);doc.text('Seite '+p+' von '+pages,L+W,290,{align:'right'})}
  const fn='Uebungsblatt_Grundflaeche_Hoehe_'+seed+'.pdf';
  try{doc.save(fn);msg.textContent='Fertig: '+fn+' (Blatt-Nr. '+seed+')';}catch(e){msg.textContent='Die PDF konnte hier nicht gespeichert werden. Öffne die Lernseite in einem normalen Browserfenster.';}
  return doc;
}
function route(){
  let h=(location.hash||'').slice(1);if(!S[h]&&h!=='test'&&h!=='ab'&&h!=='sb')h='lernziele';
  nav(h);if(h==='lernziele')viewStart();else if(h==='test')viewTest();else if(h==='ab')viewAB();else if(h==='sb')viewSB();else viewSec(h);
  $('#side').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');window.scrollTo(0,0);
}
$('#menuBtn').addEventListener('click',()=>{const o=$('#side').classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',o)});
window.addEventListener('hashchange',route);route();

</script>
